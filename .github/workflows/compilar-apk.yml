name: Compilar Alarma

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Generar APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          if [ -f Alarma.zip ]; then
            unzip -o -q Alarma.zip
          elif [ ! -f settings.gradle.kts ] && [ -f Alarma-Ladrillo.zip ]; then
            unzip -o -q Alarma-Ladrillo.zip
          fi
          ls -la

      - name: Verificar proyecto
        run: |
          if [ ! -f settings.gradle.kts ]; then
            echo "Falta settings.gradle.kts: subí el zip Alarma.zip al repositorio"
            exit 1
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Alarma-APK
          path: app/build/outputs/apk/debug/app-debug.apk
